<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one screen, a felt game table with the hexagonal board in the middle and a thin toolbar on top. */
:root {
  --felt: #1f2a24; --felt-2: #26342c; --ink: #f1e7d3; --ink-dim: #b9ad95;
  --maple: #e9cf9f; --walnut: #9a6a3f; --rim: #4a2f1b; --brass: #d9a441; --alarm: #e0473c;
  --ivory: #f7f0e1; --ebony: #1c1a19; --ruby: #c8262c;
  --display: "Alegreya SC", "Palatino", Georgia, serif;
  --body: "Alegreya Sans", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --glyph: "Apple Symbols", "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(ellipse at 50% 45%, var(--felt-2), var(--felt) 70%); color: var(--ink);
  font: 17px/1.35 var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; }
.app { height: 100%; display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar h1 { font: 700 22px/1 var(--display); letter-spacing: .04em; margin: 0 auto 0 0; color: var(--brass); }
button { font: 500 16px/1 var(--body); color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(241,231,211,.22);
  border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
button:active { background: rgba(255,255,255,.16); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .4; }
button.primary { background: var(--brass); color: #2a1c0c; border-color: var(--brass); font-weight: 700; }
.status { text-align: center; min-height: 28px; font: 500 19px/1.3 var(--body); margin-top: 6px; }
.status.alarm { color: #ffb4a8; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
svg#board { width: 100%; height: 100%; max-width: 100%; touch-action: none; }
#world { transition: transform .7s cubic-bezier(.4,.1,.2,1); }
.cell { stroke: rgba(60,35,15,.35); stroke-width: .002; cursor: pointer; }
.cell.l { fill: var(--maple); } .cell.d { fill: var(--walnut); }
.mark { pointer-events: none; }
.piece { pointer-events: none; }
.piece text { font-family: var(--glyph); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke-linejoin: round; }
.piece .rot { transition: transform .7s cubic-bezier(.4,.1,.2,1); }
.o0 { fill: var(--ivory); stroke: #3b2a18; } .o1 { fill: var(--ebony); stroke: #efe3c9; } .o2 { fill: var(--ruby); stroke: #3a0b0d; }
.label text { font-family: var(--display); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.label .bg { fill: rgba(0,0,0,.25); stroke: rgba(241,231,211,.2); stroke-width: .004; }
.label.on .bg { fill: rgba(217,164,65,.28); stroke: var(--brass); stroke-width: .008; }
.label.out { opacity: .4; }
.overlay { position: fixed; inset: 0; background: rgba(10,14,12,.72); display: grid; place-items: center; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: #2b2219; border: 1px solid rgba(217,164,65,.5); border-radius: 16px; padding: 22px; max-width: 520px; width: 100%;
  box-sizing: border-box; max-height: 86vh; overflow: auto; display: grid; gap: 14px; }
.card h2 { font: 700 26px/1.1 var(--display); color: var(--brass); margin: 0; text-wrap: balance; }
.card p, .card li { margin: 0; color: var(--ink); }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.card label { display: grid; gap: 4px; font-size: 15px; color: var(--ink-dim); }
.card input, .card select { font: 18px var(--body); color: var(--ink); background: #1b1510; border: 1px solid rgba(241,231,211,.25);
  border-radius: 8px; padding: 10px; min-height: 44px; box-sizing: border-box; }
.big { font: 700 40px/1.1 var(--display); color: var(--brass); text-align: center; }
.piece.frozen text { fill-opacity: .35; stroke-opacity: .5; }
.palette { display: grid; gap: 8px; padding-top: 8px; justify-items: center; }
.prow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pnote { color: var(--ink-dim); font-size: 15px; }
.chip { display: inline-block; width: .8em; height: .8em; border-radius: 50%; border: 1px solid rgba(241,231,211,.6); margin-right: 6px; vertical-align: -1px; }
button.on { border-color: var(--brass); background: rgba(217,164,65,.25); box-shadow: 0 0 0 1px var(--brass) inset; }
button.kind { min-width: 52px; padding: 4px 8px; font-size: 16px; }
button.kind span { font: 34px/1 var(--glyph); paint-order: stroke; -webkit-text-stroke: 1px currentColor; }
button.kind.o0 span { color: var(--ivory); -webkit-text-stroke-color: #3b2a18; }
button.kind.o1 span { color: var(--ebony); -webkit-text-stroke-color: #efe3c9; }
button.kind.o2 span { color: var(--ruby); -webkit-text-stroke-color: #3a0b0d; }
.row.promo { justify-content: center; } .row.promo button.kind { min-width: 72px; min-height: 72px; } .row.promo button.kind span { font-size: 48px; }
.tog { display: flex !important; align-items: center; gap: 12px; color: var(--ink) !important; font-size: 17px !important; min-height: 40px; }
.tog input { width: 26px; height: 26px; accent-color: var(--brass); flex: none; }
/* Phones held upright (body.compact, set by ui.js): icon toolbar, player strip, board edge to edge. */
.players { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 6px 0 2px; }
.players .pl { font: 700 15px var(--display); padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(241,231,211,.2); background: rgba(0,0,0,.25); white-space: nowrap; }
.players .pl.on { border-color: var(--brass); background: rgba(217,164,65,.28); }
.players .pl.out { opacity: .4; }
.players .zoom { min-width: 44px; padding: 4px 10px; font-size: 20px; border-radius: 99px; }
body.compact .app { padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
body.compact .bar { flex-wrap: nowrap; gap: 6px; padding: 0 8px; }
body.compact .bar h1 { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
body.compact .bar button { width: 44px; padding: 0; font-size: 22px; flex: none; }
body.compact .status { font-size: 17px; margin-top: 4px; padding: 0 8px; }
body.compact button.kind { min-width: 44px; padding: 4px 4px; }
body.compact button.kind span { font-size: 30px; }
@media (prefers-reduced-motion: reduce) { #world, .piece .rot { transition: none; } }
@media (max-width: 520px) { .bar h1 { font-size: 18px; } button { padding: 8px 10px; font-size: 15px; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1 id="title">Chess for Three</h1>
    <button id="undo" type="button">Undo</button>
    <button id="new" type="button">New game</button>
    <button id="rules" type="button">Rules</button>
    <button id="settings" type="button">Settings</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="players" id="players" hidden></div>
  <div class="stage"><svg id="board" viewBox="-1.13 -1.13 2.26 2.26" role="img" aria-label="Board"></svg></div>
  <div class="palette" id="palette" hidden></div>
</div>
<div class="overlay" id="dlg" hidden><div class="card" id="dlgCard"></div></div>
<script>
// Three-player chess rules on the 96-cell hexagonal board. No DOM here, so tests can run it in Node.
//
// Board model: three segments (one per player), each 8 files (a-h) x 4 ranks (1-4) = 32 cells.
// A cell index is seg*32 + rank*8 + file (file and rank from 0). Each player starts on ranks 1-2 of
// their own segment. Rank 4 is where segments meet:
//   files a-d of player p border files h-e of the previous player (p-1), rank 4 to rank 4;
//   files e-h of player p border files d-a of the next player (p+1).
// So walking "up" past your rank 4 you enter a neighbour's segment walking "down" toward their rank 1.
// The six cells d4/e4 of all players meet at the centre. With the centre fork on, a diagonal through the
// centre forks: from d4 it continues to the d4 of both other players (then c3, b2, a1); from e4 to both
// other e4s. That keeps every bishop on its own colour. With it off, diagonals stop at the centre point.
//
// Rule switches live in state.rules (see RULES); a game can also start from any custom position.
(function (root) {
  'use strict';
  const C = {};
  const mod3 = x => ((x % 3) + 3) % 3;
  const idx = (s, f, r) => s * 32 + r * 8 + f;
  const segOf = i => i >> 5, fileOf = i => i & 7, rankOf = i => (i >> 3) & 3;
  const BACK = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
  const ORTHO = [[1, 0], [-1, 0], [0, 1], [0, -1]], DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const ALL = ORTHO.concat(DIAG);
  Object.assign(C, { idx, segOf, fileOf, rankOf, ORTHO, DIAG });

  // The switchable rules and their defaults.
  //   centreFork: diagonals through the centre fork to both other players (off: they stop there).
  //   castling, doubleStep (pawn's first move may be two cells), enPassant (only the very next player may take).
  //   promo: 'queen' (a pawn always becomes a queen) or 'choose' (the player picks).
  //   kingCapture: a king left in check may be taken by the next player (off: kings are never taken).
  //   mated: 'remove' (a player who is out loses all pieces) or 'freeze' (the pieces stay, cannot move or attack,
  //          and can be captured).
  //   teams: null (everyone for themselves) or a team number per player, e.g. [0, 0, 1] = White and Black vs Red.
  //          Teammates do not capture or check each other; a team wins when no other team has a king left.
  const RULES = { centreFork: true, castling: true, doubleStep: true, enPassant: false, promo: 'queen',
    kingCapture: true, mated: 'remove', teams: null };
  C.RULES = RULES;
  const rulesOf = st => Object.assign({}, RULES, st.rules || {});
  const teamOf = (R, o) => R.teams ? R.teams[o] : o;
  const friend = (R, a, b) => teamOf(R, a) === teamOf(R, b);
  C.teamOf = teamOf;

  // One step from cell i in direction (df, dr) given in that cell's segment coordinates.
  // Returns a list of [cell, df, dr]: the direction is re-expressed in the new cell's segment.
  // Empty list = off the board; two entries = a diagonal through the centre.
  function step(i, df, dr, fork = true) {
    const s = segOf(i), f = fileOf(i), r = rankOf(i), nf = f + df, nr = r + dr;
    if (nr < 0 || nf < 0 || nf > 7) return [];
    if (nr <= 3) return [[idx(s, nf, nr), df, dr]];
    const left = f < 4;
    if (df === 0) return [[idx(left ? mod3(s - 1) : mod3(s + 1), 7 - f, 3), 0, -1]];
    if (left === (nf < 4)) return [[idx(left ? mod3(s - 1) : mod3(s + 1), 7 - nf, 3), -df, -1]];
    if (!fork) return [];
    // Through the centre (from d4 going right-up, or e4 going left-up).
    return [mod3(s + 1), mod3(s + 2)].map(q => f === 3 ? [idx(q, 3, 3), -1, -1] : [idx(q, 4, 3), 1, -1]);
  }
  C.step = step;

  // King-step and knight-jump tables, with the centre fork on [1] and off [0].
  const near = [[], []], knightT = [[], []];
  for (const fk of [0, 1]) for (let i = 0; i < 96; i++) {
    const n = new Set(), sp = (c, a, b) => step(c, a, b, !!fk);
    for (const [a, b] of ALL) for (const [t] of sp(i, a, b)) n.add(t);
    near[fk][i] = [...n];
    // Knight: one straight step, then one diagonal step that keeps going the same way (or the other order).
    const k = new Set();
    for (const [a, b] of ORTHO) for (const [c, x, y] of sp(i, a, b))
      for (const [p, q] of (x ? [[x, 1], [x, -1]] : [[1, y], [-1, y]])) for (const [t] of sp(c, p, q)) k.add(t);
    for (const [a, b] of DIAG) for (const [c, x, y] of sp(i, a, b))
      for (const [p, q] of [[x, 0], [0, y]]) for (const [t] of sp(c, p, q)) k.add(t);
    k.delete(i); for (const t of n) k.delete(t);
    knightT[fk][i] = [...k];
  }
  C.near = near[1]; C.knight = knightT[1]; C.tables = { near, knight: knightT };

  // Cells the piece on i can move to, ignoring checks and castling. attack=true: cells it attacks
  // (for pawns that is the two forward diagonals, empty or not). board defaults to st.board.
  function targets(st, i, attack, board = st.board) {
    const pc = board[i]; if (!pc) return [];
    const R = rulesOf(st), fk = R.centreFork ? 1 : 0, out = [];
    const open = t => !board[t] || !friend(R, board[t].o, pc.o);
    const slide = dirs => {
      for (const [df, dr] of dirs) {
        let front = [[i, df, dr]]; const seen = new Set([i]);
        while (front.length) {
          const next = [];
          for (const [c, a, b] of front) for (const s of step(c, a, b, !!fk)) {
            const t = s[0]; if (seen.has(t)) continue; seen.add(t);
            if (!board[t]) { out.push(t); next.push(s); } else if (open(t)) out.push(t);
          }
          front = next;
        }
      }
    };
    switch (pc.t) {
      case 'k': for (const t of near[fk][i]) if (open(t)) out.push(t); break;
      case 'n': for (const t of knightT[fk][i]) if (open(t)) out.push(t); break;
      case 'r': slide(ORTHO); break;
      case 'b': slide(DIAG); break;
      case 'q': slide(ALL); break;
      case 'p': {
        const fd = segOf(i) === pc.o ? 1 : -1;
        for (const df of [1, -1]) for (const [t] of step(i, df, fd, !!fk)) {
          if (attack || (board[t] && open(t))) out.push(t);
          else if (R.enPassant && st.ep && st.ep.skip === t && !board[t] && !friend(R, st.ep.o, pc.o)) out.push(t);
        }
        if (attack) break;
        const f1 = step(i, 0, fd)[0];
        if (f1 && !board[f1[0]]) {
          out.push(f1[0]);
          if (R.doubleStep && segOf(i) === pc.o && rankOf(i) === 1) { const f2 = step(f1[0], 0, 1)[0]; if (f2 && !board[f2[0]]) out.push(f2[0]); }
        }
        break;
      }
    }
    return [...new Set(out)];
  }
  C.targets = targets;

  C.standardBoard = function () {
    const board = new Array(96).fill(null);
    for (let s = 0; s < 3; s++) for (let f = 0; f < 8; f++) { board[idx(s, f, 0)] = { o: s, t: BACK[f] }; board[idx(s, f, 1)] = { o: s, t: 'p' }; }
    return board;
  };

  // What is wrong with a custom position, or null if it can be played. Each player in the game needs
  // exactly one king (a player with no pieces at all simply does not play); pawns may not stand on
  // another player's first row (they would already be queens); at least two sides must play.
  C.checkSetup = function (board, rules) {
    const R = Object.assign({}, RULES, rules || {});
    for (let o = 0; o < 3; o++) {
      const mine = board.filter(p => p && p.o === o), kings = mine.filter(p => p.t === 'k').length;
      if (kings > 1) return { error: 'twoKings', p: o };
      if (mine.length && !kings) return { error: 'noKing', p: o };
    }
    for (let i = 0; i < 96; i++) { const p = board[i]; if (p && p.t === 'p' && rankOf(i) === 0 && segOf(i) !== p.o) return { error: 'pawnRow', p: p.o }; }
    const sides = new Set([0, 1, 2].filter(o => board.some(p => p && p.o === o && p.t === 'k')).map(o => teamOf(R, o)));
    if (sides.size < 2) return { error: 'sides' };
    return null;
  };

  // A new game: the standard start, or a custom board (pieces on their starting squares may still castle).
  C.newGame = function (rules, board) {
    const st = { board: (board || C.standardBoard()).map(p => p && { o: p.o, t: p.t }), turn: 2, rules: Object.assign({}, RULES, rules || {}),
      alive: [0, 1, 2].map(o => (board || C.standardBoard()).some(p => p && p.o === o && p.t === 'k')),
      out: [null, null, null], captured: [[], [], []], last: null, ep: null, events: [], winners: null, draw: false, moves: 0 };
    for (let o = 0; o < 3; o++) if (!st.alive[o]) st.out[o] = 'none';
    advance(st);
    return st;
  };

  const kingOf = (board, o) => board.findIndex(p => p && p.o === o && p.t === 'k');
  // Is cell attacked by a piece whose owner passes byWho? (Frozen pieces never attack: pass alive players only.)
  function attacked(st, board, cell, byWho) {
    for (let j = 0; j < 96; j++) { const p = board[j]; if (p && byWho(p.o) && targets(st, j, true, board).includes(cell)) return true; }
    return false;
  }
  C.attacked = (st, cell, byWho) => attacked(st, st.board, cell, byWho);
  const foesOf = (st, o) => { const R = rulesOf(st); return x => st.alive[x] && !friend(R, x, o); };
  C.inCheck = (st, o) => { const k = kingOf(st.board, o); return st.alive[o] && k >= 0 && attacked(st, st.board, k, foesOf(st, o)); };

  function play(st, board, m) { // returns a new board
    const b = board.slice(), pc = b[m.from];
    const R = rulesOf(st);
    // En passant: a pawn steps onto the cell an enemy pawn just skipped, and that pawn is taken.
    if (R.enPassant && pc.t === 'p' && st.ep && m.to === st.ep.skip && !b[m.to] && !friend(R, pc.o, st.ep.o)) b[st.ep.pawn] = null;
    b[m.to] = { ...pc, m: 1 }; b[m.from] = null;
    if (m.rook != null) { b[m.rookTo] = { ...b[m.rook], m: 1 }; b[m.rook] = null; }
    if (pc.t === 'p' && rankOf(m.to) === 0 && segOf(m.to) !== pc.o) b[m.to].t = m.promo || 'q';
    return b;
  }

  // All legal moves of player o: a move may not leave o's own king attacked by a player still in the game.
  function legal(st, o, from) {
    const R = rulesOf(st), res = [], foes = foesOf(st, o);
    const list = from == null ? [...Array(96).keys()] : [from];
    for (const i of list) {
      const pc = st.board[i]; if (!pc || pc.o !== o) continue;
      let cand = targets(st, i, false).map(to => ({ from: i, to }));
      if (!R.kingCapture) cand = cand.filter(m => { const q = st.board[m.to]; return !(q && q.t === 'k' && st.alive[q.o]); });
      if (pc.t === 'p') cand = cand.flatMap(m => rankOf(m.to) === 0 && segOf(m.to) !== o
        ? (R.promo === 'choose' ? ['q', 'r', 'b', 'n'] : ['q']).map(promo => ({ ...m, promo })) : [m]);
      if (R.castling && pc.t === 'k' && !pc.m && i === idx(o, 4, 0) && !attacked(st, st.board, i, foes)) {
        for (const [rf, path, kTo, rTo] of [[7, [5, 6], 6, 5], [0, [3, 2, 1], 2, 3]]) {
          const r = st.board[idx(o, rf, 0)];
          if (!r || r.o !== o || r.t !== 'r' || r.m) continue;
          if (path.some(f => st.board[idx(o, f, 0)])) continue;
          if (path.slice(0, 2).some(f => attacked(st, st.board, idx(o, f, 0), foes))) continue; // the king may not cross an attacked cell
          cand.push({ from: i, to: idx(o, kTo, 0), rook: idx(o, rf, 0), rookTo: idx(o, rTo, 0) });
        }
      }
      for (const m of cand) {
        const b = play(st, st.board, m), k = kingOf(b, o);
        if (!attacked(st, b, k, foes)) res.push(m);
      }
    }
    return res;
  }
  C.legal = legal;

  function eliminate(st, o, why) {
    st.alive[o] = false; st.out[o] = why;
    if (rulesOf(st).mated === 'remove') for (let j = 0; j < 96; j++) if (st.board[j] && st.board[j].o === o) st.board[j] = null;
  }

  // Make move m for the player to move. Returns the new state (the old one is not changed).
  C.move = function (st0, m) {
    const st = JSON.parse(JSON.stringify(st0));
    const me = st.turn, pc = st.board[m.from];
    let cap = st.board[m.to];
    st.events = [];
    const before = st.board;
    st.board = play(st, st.board, m);
    if (!cap && pc.t === 'p' && st.ep && m.to === st.ep.skip && before[st.ep.pawn] && !st.board[st.ep.pawn]) cap = before[st.ep.pawn];
    if (cap) {
      st.captured[me].push(cap.t);
      if (cap.t === 'k' && st.alive[cap.o]) { eliminate(st, cap.o, 'king'); st.events.push({ type: 'kingTaken', p: cap.o, by: me }); }
    }
    if (pc.t === 'p' && st.board[m.to].t !== 'p') st.events.push({ type: 'promo', p: me, t: st.board[m.to].t });
    // En passant is possible only for the next move, after a two-cell pawn step.

  function layout() {
    const c = isCompact(); if (c === compact && svg.dataset.ready) return;
    compact = c; svg.dataset.ready = 1; document.body.classList.toggle('compact', compact); applyView(); render();
  }
  window.addEventListener('resize', layout);

  const winText = t => st.winners.length > 1 ? fill(t.winTeam, { n: st.winners.map(nameOf).join(t.and) }) : fill(t.wins, { n: nameOf(st.winners[0]) });
  function renderStatus(t) {
    const s = $('status'); s.className = 'status'; s.textContent = '';
    const chip = p => { const c = document.createElement('span'); c.className = 'chip'; c.style.background = ['var(--ivory)', 'var(--ebony)', 'var(--ruby)'][p]; s.appendChild(c); };
    if (edit) { s.textContent = edit.err || t.editHint; if (edit.err) s.classList.add('alarm'); return; }
    const ev = (st.events || []).filter(e => e.type !== 'check');
    let msg = ev.map(e => fill(e.type === 'kingTaken' ? t.king : t[e.type], { n: nameOf(e.p), b: nameOf(e.by), t: t.pieceName[e.t] || '' })).join(' ');
    if (st.winners != null) { st.winners.forEach(chip); msg = (msg ? msg + ' ' : '') + winText(t); }
    else if (st.draw) msg = (msg ? msg + ' ' : '') + t.draw;
    else {
      chip(st.turn);
      const chk = C.inCheck(st, st.turn);
      msg = (msg ? msg + ' ' : '') + fill(chk ? t.check : t.toMove, { n: nameOf(st.turn) });
      if (chk) s.classList.add('alarm');
    }
    s.appendChild(document.createTextNode(msg));
  }

  // ---- piece editor ----
  function renderPalette(t) {
    const pal = $('palette'); pal.hidden = !edit; if (!edit) return;
    const who = [0, 1, 2].map(p => `<button type="button" class="who${edit.o === p ? ' on' : ''}" data-o="${p}"><span class="chip" style="background:${['var(--ivory)', 'var(--ebony)', 'var(--ruby)'][p]}"></span>${esc(nameOf(p))}</button>`).join('');
    const kinds = ['k', 'q', 'r', 'b', 'n', 'p'].map(k => `<button type="button" class="kind o${edit.o}${edit.t === k ? ' on' : ''}" data-t="${k}" aria-label="${k}"><span>${glyph(k)}</span></button>`).join('')
      + `<button type="button" class="kind erase${edit.t === 'x' ? ' on' : ''}" data-t="x">${esc(t.erase)}</button>`;
    const counts = [0, 1, 2].map(p => edit.board.filter(x => x && x.o === p).length);
    const note = counts.map((n, p) => n ? '' : fill(t.noPieces, { n: nameOf(p) })).filter(Boolean).join(' · ');
    pal.innerHTML = `<div class="prow">${who}</div><div class="prow">${kinds}</div>
      ${note ? `<div class="pnote">${esc(note)}</div>` : ''}
      <div class="prow"><button type="button" id="eReset">${esc(t.reset)}</button><button type="button" id="eClear">${esc(t.clear)}</button>
      <button type="button" id="eCancel">${esc(t.cancel)}</button><button type="button" class="primary" id="eStart">${esc(t.start)}</button></div>`;
    pal.querySelectorAll('.who').forEach(b => b.onclick = () => { edit.o = +b.dataset.o; render(); });
    pal.querySelectorAll('.kind').forEach(b => b.onclick = () => { edit.t = b.dataset.t; render(); });
    $('eReset').onclick = () => { edit.board = C.standardBoard(); edit.err = null; render(); };
    $('eClear').onclick = () => { edit.board = new Array(96).fill(null); edit.err = null; render(); };
    $('eCancel').onclick = () => { edit = null; render(); };
    $('eStart').onclick = () => {
      const bad = C.checkSetup(edit.board, save.rules), t2 = tr();
      if (bad) { edit.err = fill({ twoKings: t2.eTwoKings, noKing: t2.eNoKing, sides: t2.eSides, pawnRow: t2.ePawnRow }[bad.error], { n: bad.p != null ? nameOf(bad.p) : '' }); beep(200, 0.2); render(); return; }
      save.setup = edit.board; const b = edit.board; edit = null; startGame(b);
    };
  }
  function editTap(i) {
    const b = edit.board, cur = b[i]; edit.err = null;
    if (edit.t === 'x' || (cur && cur.o === edit.o && cur.t === edit.t)) b[i] = null;
    else {
      if (edit.t === 'k') for (let j = 0; j < 96; j++) if (b[j] && b[j].o === edit.o && b[j].t === 'k') b[j] = null; // one king each: it moves
      b[i] = { o: edit.o, t: edit.t };
    }
    beep(600, 0.04); render();
  }
  function openEditor() { edit = { board: (save.setup || C.standardBoard()).map(p => p && { o: p.o, t: p.t }), o: 0, t: 'q', err: null }; sel = null; moves = []; render(); }

  // ---- sounds (tiny clicks from Web Audio, started by a tap) ----
  let ac = null;
  function beep(freq, len) {
    if (!save.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + len);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + len);
    } catch (e) { /* no sound */ }
  }

  function doMove(m) {
    save.hist.push(st); if (save.hist.length > 300) save.hist.shift();
    const cap = !!st.board[m.to];
    st = C.move(st, m); sel = null; moves = []; animate = true;
    beep(cap ? 330 : 520, cap ? 0.25 : 0.12);
    if (st.events.some(e => e.type === 'check')) setTimeout(() => beep(880, 0.3), 150);
    persist(); render();
  }
  function tap(i) {
    if (over()) return;
    const ms = moves.filter(x => x.to === i);
    if (sel != null && ms.length) {
      if (ms.length > 1) return pickPromo(ms); // the player chooses what the pawn becomes
      return doMove(ms[0]);
    }
    const pc = st.board[i];
    if (pc && pc.o === st.turn && i !== sel) { sel = i; moves = C.legal(st, st.turn, i); beep(700, 0.05); }
    else { sel = null; moves = []; }
    render();
  }
  function persist() { save.game = st; store(); }

  // ---- dialogs ----
  const dlg = $('dlg'), card = $('dlgCard');
  function open(html, wire) { card.innerHTML = html; dlg.hidden = false; wire && wire(); const b = card.querySelector('button'); b && b.focus(); }
  const shut = () => { dlg.hidden = true; };
  dlg.addEventListener('pointerdown', e => { if (e.target === dlg) shut(); });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function startGame(board) { st = C.newGame(save.rules, board); st.custom = !!board; save.hist = []; sel = null; moves = []; shownEnd = false; persist(); render(); }
  function pickPromo(ms) {
    const t = tr(), o = st.turn;
    open(`<h2>${esc(t.pick)}</h2><div class="row promo">${ms.map(m => `<button type="button" class="kind o${o}" data-p="${m.promo}" aria-label="${esc(t.pieceName[m.promo])}"><span>${glyph(m.promo)}</span></button>`).join('')}</div>`,
      () => card.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { shut(); doMove(ms.find(m => m.promo === b.dataset.p)); }));
  }
  function showEnd() {
    const t = tr();
    open(`<div class="big">${st.winners != null ? esc(winText(t)) : esc(t.draw)}</div>
      <div class="row"><button id="dClose" type="button">${esc(t.close)}</button><button class="primary" id="dAgain" type="button">${esc(t.again)}</button></div>`,
    () => { $('dClose').onclick = shut; $('dAgain').onclick = () => { shut(); startGame(st.custom ? save.setup : null); }; });
  }
  $('new').onclick = () => {
    const t = tr();
    open(`<h2>${esc(t.sure)}</h2><div class="row"><button id="dNo" type="button">${esc(t.no)}</button>
      <button id="dCustom" type="button">${esc(t.custom)}</button><button class="primary" id="dYes" type="button">${esc(t.standard)}</button></div>`,
    () => { $('dNo').onclick = shut; $('dYes').onclick = () => { shut(); edit = null; startGame(); }; $('dCustom').onclick = () => { shut(); openEditor(); }; });
  };
  $('undo').onclick = () => {
    if (!save.hist.length || edit) return;
    st = fix(save.hist.pop()); sel = null; moves = []; shownEnd = over(); persist(); render();
  };

  // Rule switches (for the next game) and the short how-to-play.
  $('rules').onclick = () => {
    const t = tr(), R = Object.assign({}, C.RULES, save.rules);
    const box = (id, on, label) => `<label class="tog" for="${id}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}><span>${esc(label)}</span></label>`;
    const n = nameOf, teamOpts = TEAMS.map((tm, k) => {
      const lbl = !tm ? t.teamNone : (() => { const lone = tm.findIndex(x => tm.filter(y => y === x).length === 1), pair = [0, 1, 2].filter(x => x !== lone); return fill(t.teamVs, { a: n(pair[0]), b: n(pair[1]), c: n(lone) }); })();
      return `<option value="${k}">${esc(lbl)}</option>`;
    }).join('');
    open(`<h2>${esc(t.rulesFor)}</h2>
      <label for="rTeams">${esc(t.rTeams)}<select id="rTeams">${teamOpts}</select></label>
      ${box('rCentre', R.centreFork, t.rCentre)}${box('rCastling', R.castling, t.rCastling)}${box('rDouble', R.doubleStep, t.rDouble)}
      ${box('rEp', R.enPassant, t.rEp)}${box('rKingCap', R.kingCapture, t.rKingCap)}
      <label for="rPromo">${esc(t.rPromo)}<select id="rPromo"><option value="queen">${esc(t.promoQ)}</option><option value="choose">${esc(t.promoChoose)}</option></select></label>
      <label for="rMated">${esc(t.rMated)}<select id="rMated"><option value="remove">${esc(t.matedRemove)}</option><option value="freeze">${esc(t.matedFreeze)}</option></select></label>
      <div class="row"><button id="rSave" type="button">${esc(t.saveRules)}</button><button class="primary" id="rStart" type="button">${esc(t.saveStart)}</button></div>
      <h2>${esc(t.nowRules)}</h2><ul>${t.rulesText.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="row"><button id="rClose" type="button">${esc(t.close)}</button></div>`,
    () => {
      $('rTeams').value = String(Math.max(0, TEAMS.findIndex(x => JSON.stringify(x) === JSON.stringify(R.teams))));
      $('rPromo').value = R.promo; $('rMated').value = R.mated;
      const read = () => {
        save.rules = { centreFork: $('rCentre').checked, castling: $('rCastling').checked, doubleStep: $('rDouble').checked, enPassant: $('rEp').checked,
          kingCapture: $('rKingCap').checked, promo: $('rPromo').value, mated: $('rMated').value, teams: TEAMS[+$('rTeams').value] };
        store();
      };
      $('rSave').onclick = () => { read(); shut(); };
      $('rStart').onclick = () => { read(); shut(); edit = null; startGame(); };
      $('rClose').onclick = shut;
    });
  };
  $('settings').onclick = () => {
    const t = tr();
    open(`<h2>${esc(t.settings)}</h2>
      ${[0, 1, 2].map(p => `<label for="nm${p}">${esc(fill(t.nameOf, { k: p + 1 }))} (${esc(t.names[p])})<input id="nm${p}" maxlength="14" value="${esc(save.names[p] || '')}" placeholder="${esc(t.names[p])}"></label>`).join('')}
      <label for="vw">${esc(t.view)}<select id="vw">
        <option value="fixed">${esc(t.vFixed)}</option><option value="turn">${esc(t.vTurn)}</option><option value="table">${esc(t.vTable)}</option></select></label>
      <label for="lg">${esc(t.lang)}<select id="lg"><option value="en">English</option><option value="ru">Русский</option></select></label>
      <label for="snd">${esc(t.sound)}<select id="snd"><option value="1">✓</option><option value="0">✕</option></select></label>
      <div class="row"><button class="primary" id="dOk" type="button">${esc(t.close)}</button></div>`,
    () => {
      $('vw').value = save.view; $('lg').value = save.lang; $('snd').value = save.sound ? '1' : '0';
      $('dOk').onclick = () => {
        save.names = [0, 1, 2].map(p => $('nm' + p).value.trim() || null);
        save.view = $('vw').value; save.lang = $('lg').value; save.sound = $('snd').value === '1';
        store(); shut(); render();
      };
    });
  };

  // Keep the screen on during a game where the browser allows it.
  const wake = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* not allowed */ } };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
  wake();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

  build(); layout();
  window.__chess3 = { get state() { return st; }, tap, get editing() { return !!edit; } };
})();
</script>
</body>
</html>
